services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/linkshort
      BASE_URL: http://localhost:4000
      RATE_LIMIT_MAX: 30
    ports:
      - "4000:4000"

volumes:
  mongo-data:
